[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"

[project]
name="claudecodegym"
version="26.8.12"
description="Source-backed GymAct benchmark corpus and provider for Claude Code"
readme="README.md"
requires-python=">=3.11"
license={text="MIT"}
authors=[{name="Sean Chatman"}]
dependencies=[]

[project.optional-dependencies]
rdf=["rdflib>=7.1,<8","pyshacl>=0.30,<1"]
dev=["pytest>=8,<10","rdflib>=7.1,<8"]

[project.entry-points."gymact.providers"]
claudecode="claudecodegym.provider:ClaudeCodeProvider"

[project.scripts]
claudecodegym-research="claudecodegym.research:main"

[tool.setuptools.package-data]
claudecodegym=["data/*.json"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q -rs"
